name: CI

on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: GOOS=js GOARCH=wasm go vet ./...

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: rustup target add wasm32-unknown-unknown && rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --release -- -D warnings
      - run: cargo test --release
      - run: cargo build --release --target wasm32-unknown-unknown

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error -m py_compile bot/main.py scripts/html.py scripts/process.py
