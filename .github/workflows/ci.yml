name: CI

on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - run: GOOS=js GOARCH=wasm go vet ./...

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error -m py_compile bot/main.py scripts/html.py scripts/process.py
